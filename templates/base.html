<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>{% block titulo %}{{ n.nombre }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='icono.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icono-apple.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Citas">
  {% block cabeza %}{% endblock %}
</head>
<body>
{% if demo %}
<div class="demo-barra">
  <b>MODO PRUEBA</b>
  <a href="{{ url_for('inicio') }}">👤 Cliente</a>
  <a href="{{ url_for('panel') }}">✂️ Barbero</a>
</div>
{% endif %}
{% block cuerpo %}{% endblock %}
</body>
</html>
